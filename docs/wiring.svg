<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3d3d3a">
<title>Simple Zigbee Knob wiring</title>
<rect width="680" height="610" fill="#ffffff"/>

<!-- ESP32-C6 Super Mini -->
<rect x="40" y="40" width="180" height="470" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="130" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">ESP32-C6 Super Mini</text>
<g text-anchor="end" dominant-baseline="central">
<text x="210" y="80">3V3</text>
<text x="210" y="120">GPIO 6</text>
<text x="210" y="160">GPIO 7</text>
<text x="210" y="245">5V</text>
<text x="210" y="310">GPIO 18</text>
<text x="210" y="350">GND</text>
<text x="210" y="400">GPIO 0</text>
<text x="210" y="440">GPIO 1</text>
<text x="210" y="480">GPIO 20</text>
</g>

<!-- AS5600 -->
<rect x="480" y="62" width="160" height="158" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="630" y="128" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">AS5600</text>
<text x="630" y="146" text-anchor="end" dominant-baseline="central" fill="#534AB7">3.3 V only</text>
<g dominant-baseline="central" fill="#3C3489">
<text x="490" y="80">VCC</text>
<text x="490" y="120">SDA</text>
<text x="490" y="160">SCL</text>
<text x="490" y="190">GND</text>
<text x="490" y="206">DIR</text>
</g>

<!-- LED ring -->
<rect x="480" y="232" width="160" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="630" y="270" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">LED ring</text>
<text x="630" y="288" text-anchor="end" dominant-baseline="central" fill="#0F6E56">12× WS2812</text>
<g dominant-baseline="central" fill="#085041">
<text x="490" y="245">5V</text>
<text x="490" y="270">GND</text>
<text x="490" y="310">DIN</text>
</g>

<!-- Wires -->
<g fill="none" stroke-width="1.5">
<line x1="220" y1="80" x2="480" y2="80" stroke="#EF9F27"/>
<line x1="220" y1="120" x2="480" y2="120" stroke="#378ADD"/>
<line x1="220" y1="160" x2="480" y2="160" stroke="#378ADD"/>
<line x1="220" y1="245" x2="480" y2="245" stroke="#E24B4A"/>
<path d="M220 310 H360 M410 310 H480" stroke="#378ADD"/>
<path d="M480 190 H300 V520 H520 V400 H470" stroke="#888780"/>
<line x1="480" y1="206" x2="300" y2="206" stroke="#888780"/>
<line x1="480" y1="270" x2="300" y2="270" stroke="#888780"/>
<line x1="220" y1="350" x2="300" y2="350" stroke="#888780"/>
<line x1="470" y1="440" x2="520" y2="440" stroke="#888780"/>
<line x1="470" y1="480" x2="520" y2="480" stroke="#888780"/>
<path d="M220 400 H420 M220 440 H420 M220 480 H420" stroke="#378ADD"/>
<path d="M455 245 V253 M455 261 V270" stroke="#888780"/>
</g>

<!-- 330 ohm -->
<rect x="360" y="304" width="50" height="12" rx="2" fill="none" stroke="#3d3d3a" stroke-width="1.2"/>
<text x="385" y="294" text-anchor="middle" dominant-baseline="central">330 Ω</text>

<!-- Capacitor -->
<line x1="446" y1="253" x2="464" y2="253" stroke="#3d3d3a" stroke-width="1.5"/>
<path d="M446 263 Q455 257 464 263" fill="none" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="440" y="258" text-anchor="end" dominant-baseline="central">+ 470 µF</text>

<!-- Buttons -->
<g fill="none" stroke="#3d3d3a" stroke-width="1.2">
<circle cx="424" cy="400" r="3"/><circle cx="466" cy="400" r="3"/><line x1="426" y1="397" x2="462" y2="388"/>
<circle cx="424" cy="440" r="3"/><circle cx="466" cy="440" r="3"/><line x1="426" y1="437" x2="462" y2="428"/>
<circle cx="424" cy="480" r="3"/><circle cx="466" cy="480" r="3"/><line x1="426" y1="477" x2="462" y2="468"/>
</g>
<g dominant-baseline="central">
<text x="534" y="400">Button 1 (left)</text>
<text x="534" y="440">Button 2 (middle)</text>
<text x="534" y="480">Button 3 (right)</text>
</g>

<!-- Junctions -->
<g fill="#3d3d3a">
<circle cx="300" cy="206" r="3"/><circle cx="300" cy="270" r="3"/><circle cx="300" cy="350" r="3"/>
<circle cx="455" cy="245" r="3"/><circle cx="455" cy="270" r="3"/>
<circle cx="520" cy="440" r="3"/><circle cx="520" cy="480" r="3"/>
</g>

<!-- Legend -->
<g dominant-baseline="central">
<line x1="40" y1="562" x2="60" y2="562" stroke="#E24B4A" stroke-width="2"/><text x="66" y="562">5V</text>
<line x1="100" y1="562" x2="120" y2="562" stroke="#EF9F27" stroke-width="2"/><text x="126" y="562">3V3</text>
<line x1="170" y1="562" x2="190" y2="562" stroke="#888780" stroke-width="2"/><text x="196" y="562">GND</text>
<line x1="245" y1="562" x2="265" y2="562" stroke="#378ADD" stroke-width="2"/><text x="271" y="562">Signal</text>
<text x="40" y="586">Dot = connected · crossing without dot = not connected</text>
</g>
</svg>
