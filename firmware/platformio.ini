; Simple Zigbee Knob – ESP32-C6 Super Mini
; Needs Arduino core 3.x (C6 + Zigbee), which the official espressif32 platform does not ship,
; so this uses the pioarduino fork.
;
;   pio run -t upload        build and flash
;   pio device monitor       serial log (115200 baud)

[env:c6_simple]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; The Super Mini has 4 MB flash
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
; Partition table with zb_storage / zb_fct (ships with the Arduino core).
; Must match the role: zigbee.csv for end device, zigbee_zczr.csv for router.
board_build.partitions = zigbee.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DZIGBEE_MODE_ED              ; End device (receiver always on). Router: -DZIGBEE_MODE_ZCZR + zigbee_zczr.csv
    -DARDUINO_USB_MODE=1          ; USB Serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial == USB-C port
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
